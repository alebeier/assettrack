# ---------------------------------------------------------------
# Workflow reutilizable: build, calidad, seguridad y despliegue.
# No se dispara solo. Lo invocan ci-dev.yml y ci-prod.yml.
# ---------------------------------------------------------------
name: Pipeline reutilizable

on:
  workflow_call:
    inputs:
      environment:
        description: "Entorno destino (dev o prod)"
        required: true
        type: string
      frontend_port:
        description: "Puerto publicado en VM-APP"
        required: true
        type: number
      tfstate_path:
        description: "Ruta del estado de Terraform, fuera del workspace del runner"
        required: true
        type: string
      gates_bloqueantes:
        description: "true = el quality gate y el escaneo detienen el pipeline. Se usa en prod."
        required: false
        default: false
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/alebeier/assettrack-backend
  IMAGE_FRONTEND: ghcr.io/alebeier/assettrack-frontend
  VM_APP: 192.168.56.20

jobs:

  # =============================================================
  # 1. Tests y analisis estatico
  # =============================================================
  calidad:
    name: Tests y SonarQube
    runs-on: [self-hosted, linux, x64, vm-ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar necesita el historial para el blame

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r requirements-dev.txt

      - name: Correr tests con cobertura
        working-directory: backend
        run: |
          .venv/bin/pytest tests/ -v \
            --cov=app \
            --cov-report=term \
            --cov-report=xml:coverage.xml

      - name: Analisis SonarQube
        id: sonar
        continue-on-error: ${{ !inputs.gates_bloqueantes }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=${{ inputs.gates_bloqueantes }}
            -Dsonar.branch.name=${{ github.ref_name }}

      - name: Resultado del quality gate
        if: always()
        run: |
          if [ "${{ steps.sonar.outcome }}" = "success" ]; then
            echo "Quality gate: OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Quality gate: NO SUPERADO" >> "$GITHUB_STEP_SUMMARY"
            echo "Modo bloqueante: ${{ inputs.gates_bloqueantes }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Detalle en ${{ secrets.SONAR_HOST_URL }}/dashboard?id=assettrack" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ inputs.environment }}
          path: backend/coverage.xml
          retention-days: 30

  # =============================================================
  # 2. Build, push, SBOM y escaneo de vulnerabilidades
  # =============================================================
  imagen:
    name: Build, SBOM y escaneo
    runs-on: [self-hosted, linux, x64, vm-ci]
    needs: calidad

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:${{ inputs.environment }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build y push del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:${{ inputs.environment }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- SBOM: entregable del trabajo -----
      - name: Generar SBOM en formato CycloneDX
        run: |
          syft "${IMAGE_BACKEND}:${{ github.sha }}" \
            -o cyclonedx-json=sbom-backend-cyclonedx.json
          syft "${IMAGE_FRONTEND}:${{ github.sha }}" \
            -o cyclonedx-json=sbom-frontend-cyclonedx.json
          echo "Componentes backend:  $(jq '.components | length' sbom-backend-cyclonedx.json)"
          echo "Componentes frontend: $(jq '.components | length' sbom-frontend-cyclonedx.json)"

      - name: Generar SBOM en formato SPDX
        run: |
          syft "${IMAGE_BACKEND}:${{ github.sha }}" \
            -o spdx-json=sbom-backend-spdx.json
          syft "${IMAGE_FRONTEND}:${{ github.sha }}" \
            -o spdx-json=sbom-frontend-spdx.json

      - name: Publicar SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.environment }}-${{ github.sha }}
          path: sbom-*.json
          retention-days: 90

      # ----- Escaneo de vulnerabilidades -----
      - name: Reporte de vulnerabilidades
        run: |
          for img in "${IMAGE_BACKEND}" "${IMAGE_FRONTEND}"; do
            echo "===== ${img} ====="
            trivy image --scanners vuln --severity HIGH,CRITICAL \
              --format table "${img}:${{ github.sha }}" || true
          done

      - name: Resumen de vulnerabilidades
        if: always()
        run: |
          {
            echo "### Escaneo de vulnerabilidades"
            echo ""
            echo "| Imagen | HIGH | CRITICAL |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for img in "${IMAGE_BACKEND}" "${IMAGE_FRONTEND}"; do
            trivy image --scanners vuln --severity HIGH,CRITICAL \
              --format json -o /tmp/tv.json "${img}:${{ github.sha }}" 2>/dev/null || true
            alto=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' /tmp/tv.json 2>/dev/null || echo 0)
            crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' /tmp/tv.json 2>/dev/null || echo 0)
            echo "| \`$(basename ${img})\` | ${alto} | ${crit} |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Gate de seguridad — CRITICAL con fix disponible
        continue-on-error: ${{ !inputs.gates_bloqueantes }}
        run: |
          for img in "${IMAGE_BACKEND}" "${IMAGE_FRONTEND}"; do
            trivy image --scanners vuln \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "${img}:${{ github.sha }}"
          done

      # ----- Opcional: Dependency-Track -----
      - name: Subir SBOM a Dependency-Track
        continue-on-error: true
        run: |
          if ! curl -sf -m 3 http://192.168.56.10:8081/api/version > /dev/null; then
            echo "Dependency-Track apagado, se omite la subida."
            exit 0
          fi
          echo "Dependency-Track disponible. Configurar DTRACK_API_KEY para subir."

  # =============================================================
  # 3. Despliegue con Terraform
  # =============================================================
  desplegar:
    name: Terraform apply a ${{ inputs.environment }}
    runs-on: [self-hosted, linux, x64, vm-ci]
    needs: imagen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="path=${{ inputs.tfstate_path }}"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan -input=false -out=tfplan \
            -var-file="envs/${{ inputs.environment }}.tfvars" \
            -var="backend_image=${IMAGE_BACKEND}:${{ github.sha }}" \
            -var="frontend_image=${IMAGE_FRONTEND}:${{ github.sha }}" \
            -var="git_sha=${{ github.sha }}" \
            -var="app_version=${{ github.ref_name }}"

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Smoke test
        run: |
          URL="http://${VM_APP}:${{ inputs.frontend_port }}"
          for i in $(seq 1 15); do
            if curl -sf "${URL}/api/version" > /dev/null; then
              echo "Aplicacion respondiendo."
              curl -s "${URL}/api/version"
              exit 0
            fi
            echo "Intento $i sin respuesta, reintentando..."
            sleep 4
          done
          echo "La aplicacion no respondio tras 60 segundos."
          docker -H "ssh://deploy@${VM_APP}" ps -a
          exit 1

      - name: Resumen del despliegue
        run: |
          {
            echo "### Despliegue a \`${{ inputs.environment }}\`"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| URL | http://${VM_APP}:${{ inputs.frontend_port }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Rama | \`${{ github.ref_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
